<div class="friends-panel">
  <div class="friends-copy">
    <span>Here are some of my friends.</span>
  </div>
  <div class="friends-links">
    {% for friend in site.data.friends %}
    <a href="{{ friend.url }}" target="_blank" rel="noopener">{{ friend.name }}</a>
    {% endfor %}
  </div>
</div>
