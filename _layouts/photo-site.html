<!DOCTYPE html>
<html lang="en" data-auto-theme="{{ site.auto_dark_mode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: "Photography" | escape }} — {{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <script src="{{ "/assets/js/theme-toggle.js" | relative_url }}"></script>
  <link rel="stylesheet" href="{{ "/assets/css/font.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/assets/css/photography.css" | relative_url }}">
  {% if site.favicon %}<link rel="icon" href="{{ site.favicon | relative_url }}">{% endif %}
</head>
<body class="photography-site{% unless page.album_id %} photography-index{% endunless %}" id="top">
  <a class="photo-skip-link" href="#main">Skip to content</a>
  <header class="photo-masthead">
    <nav class="photo-site-nav" aria-label="Photography navigation">
      <a href="{{ "/photos/#archive" | relative_url }}"{% unless page.album_id %} aria-current="page"{% endunless %}>Index</a>
      <a href="{{ "/" | relative_url }}">About ↗</a>
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch to dark theme" hidden><span aria-hidden="true">◐</span></button>
    </nav>
  </header>
  <main class="photo-main" id="main">
    {{ content }}
  </main>
  <footer class="photo-footer">
    <a href="{{ "/photos/" | relative_url }}">Yihang Du <span>Photography</span></a>
    <span>© {{ site.time | date: "%Y" }} Yihang Du</span>
    <a href="#top">Back to top <span aria-hidden="true">↑</span></a>
  </footer>
  <script src="{{ "/assets/js/photography.js" | relative_url }}" defer></script>
  {% unless page.album_id %}
  <script src="{{ "/assets/js/photo-archive.js" | relative_url }}" defer></script>
  <script src="{{ "/assets/js/photo-motion.js" | relative_url }}" defer></script>
  {% endunless %}
</body>
</html>
