<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - {{ page.title | default: "Photo Gallery" }}</title>
    <link rel="stylesheet" href="assets/css/gallery.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h1 class="title"><a href="/gallery.html">Gallery</a></h1>
            <nav class="menu" id="gallery-nav">
                <a href="#" id="overview-link" class="active">Overview</a>
            </nav>
        </aside>
        <main class="main-content" id="gallery-container">
            <!-- Gallery content will be injected here -->
        </main>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="">
        <div id="lightbox-caption"></div>
    </div>

    <script src="assets/js/gallery-data.js"></script>
    <script src="assets/js/gallery.js"></script>
</body>
</html>
